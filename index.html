<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ▼ 確実にズームを禁止するmetaタグ ▼ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>TUBE_SAMPLER</title>
    <style>
        /* ページ全体でタッチによるズームやデフォルト動作を完全に制限 */
        html {
            touch-action: none;
            -webkit-text-size-adjust: 100%; /* iOSで勝手に文字が拡大されるのを防止 */
        }

        /* bodyの touch-action: none は削除しました */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #0a0a0a; 
            color: #e0e0e0; 
            padding: 5px; 
            max-width: 480px; 
            margin: 0 auto; 
            overflow: hidden; 
        }

        h1 { text-align: center; color: #ff9900; font-size: 1.1rem; margin: 3px 0; }
        .container { background-color: #151515; padding: 10px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 6px; display: flex; gap: 6px; }
        input[type="text"] { flex: 1; padding: 6px; border: 1px solid #333; border-radius: 4px; background-color: #222; color: #fff; font-size: 0.8rem; }
        button { padding: 6px 10px; border: none; border-radius: 4px; background-color: #ff9900; color: #121212; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
      #player-wrapper { 
    width: 100%;       /* コンテナの幅いっぱいに広げる場合 */
    max-width: 320px;  /* 大きくしすぎないように最大幅を設定 */
    height: 180px;     /* 高さを大きくする（16:9の比率にする場合は幅に合わせる） */
    margin: 0 auto 6px auto; 
    overflow: hidden; 
    background: #000; 
    border-radius: 4px; 
    display: block; 
    pointer-events: none; /* プレイヤーへの直接のタッチ操作を遮断 */
}

        #player-wrapper iframe { width: 100%; height: 100%; border: 0; }
        .controls { display: flex; flex-direction: column; gap: 6px; background: #222; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #current-time { font-family: monospace; font-size: 1rem; color: #ff9900; font-weight: bold; }
        .slider-container { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #aaa; flex: 1; }
        .slider-container input[type="range"] { flex: 1; accent-color: #ff9900; cursor: pointer; }
        .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 5px; }
        .pad-wrapper { position: relative; height: 54px; }
        .pad { width: 100%; height: 100%; background-color: #262626; border: 2px solid #3a3a3a; border-radius: 6px; color: #ccc; font-size: 0.8rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; touch-action: none; position: relative; overflow: hidden; }
        .pad.empty { border-style: dashed; border-color: #555; color: #777; }
        .pad.set { border-style: solid; border-color: #ff9900; background-color: #3d2414; color: #fff; }
        .pad.tweaking { background-color: #0b1d1d !important; border-color: #00ffcc !important; color: #00ffcc !important; }
        .pad.active { background-color: #ff9900 !important; color: #000; box-shadow: 0 0 10px #ff9900; transform: scale(0.95); }
        .pad-text { position: relative; z-index: 5; pointer-events: none; text-align: center; }
        .pad span { font-size: 0.58rem; display: block; margin-top: 1px; }
        .wave-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0; }
        .pad.tweaking .wave-canvas { opacity: 0.85; }
        .delete-btn { position: absolute; top: 1px; right: 1px; width: 16px; height: 16px; background-color: rgba(0, 0, 0, 0.8); color: #fff; border-radius: 50%; font-size: 10px; display: none; z-index: 10; cursor: pointer; }
        .pad.set + .delete-btn { display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <h1>ULTRA SAMPLER 16</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" id="youtube-url" placeholder="YouTube URL" value="https://youtu.be/xFwThZK2XcM?si=BYwlpOn9u0wvFP6g">
            <button id="load-btn">LOAD</button>
        </div>
        <div id="player-wrapper"><div id="player"></div></div>
        <div class="controls">
            <div class="control-row">
                <div>TIME: <span id="current-time">0.00</span>s</div>
                <button id="pip-btn">PiP</button>
                <button id="clear-all-btn">ALL CLEAR</button>
            </div>
            <div class="slider-container"><span>FAST</span><input type="range" id="response-slider" min="0.01" max="0.10" step="0.01" value="0.04"><span>SMOOTH</span></div>
        </div>
        <div class="pad-grid" id="pad-container"></div>
    </div>

    <script>
        let player = null, timestamps = new Array(16).fill(null), padCooldowns = new Array(16).fill(false), audioCtx = null;
        const keyMap = ['1','2','3','4','q','w','e','r','a','s','d','f','z','x','c','v'];
        let isDragging = false, startY = 0, dragTargetIndex = null, baseTimestamp = 0, pressTimer = null, soundDuration = 0.04, mockWaveData = [];

        window.addEventListener('DOMContentLoaded', () => {
   // ▼▼▼ 【追加】ダブルタップによるズームを強引に阻止する処理 ▼▼▼
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault(); // 300ミリ秒以内の連続タップ（ダブルタップ）を無効化
                }
                lastTouchEnd = now;
            }, { passive: false });
            // ▲▲▲ここまで▲▲▲
            const padContainer = document.getElementById('pad-container');
            for (let i = 0; i < 16; i++) {
                padContainer.innerHTML += `
                    <div class="pad-wrapper">
                        <div class="pad empty" id="pad-${i}" data-index="${i}">
                            <canvas class="wave-canvas" id="canvas-${i}"></canvas>
                            <div class="pad-text">PAD ${i + 1}<span>[${keyMap[i].toUpperCase()}] EMPTY</span></div>
                        </div>
                        <div class="delete-btn" data-index="${i}">×</div>
                    </div>
                `;
            }

            document.getElementById('load-btn').addEventListener('click', () => {
                const url = document.getElementById('youtube-url').value;
                const videoId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([^&?]+)/)?.[1];
                if (videoId) initPlayer(videoId);
                else alert("正しいYouTube URLを入力してください");
            });

            document.querySelectorAll('.pad').forEach(pad => {
                const index = parseInt(pad.getAttribute('data-index'));
                pad.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    if (padCooldowns[index]) return;
                    
                    startY = e.clientY;
                    pressTimer = setTimeout(() => {
                        isDragging = true; dragTargetIndex = index; baseTimestamp = timestamps[index];
                        document.getElementById(`pad-${index}`).classList.add('tweaking');
                        generateMockWaveData(); drawWave(index, 0);
                    }, 500);

                    if (timestamps[index] === null) {
                        if (player?.getCurrentTime) {
                            let t = player.getCurrentTime();
                            timestamps[index] = t;
                            const el = document.getElementById(`pad-${index}`);
                            el.classList.remove('empty'); el.classList.add('set');
                            el.querySelector('span').innerText = `[${keyMap[index].toUpperCase()}] ${t.toFixed(2)}s`;
                            playAttackSound();
                        }
                    } else {
                        playPad(index);
                    }
                    padCooldowns[index] = true; setTimeout(() => padCooldowns[index] = false, 50);
                });
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging || dragTargetIndex === null) {
                    if (Math.abs(startY - e.clientY) > 10) clearTimeout(pressTimer);
                    return;
                }
                let delta = startY - e.clientY;
                timestamps[dragTargetIndex] = Math.max(0, baseTimestamp + delta * 0.01);
                document.getElementById(`pad-${dragTargetIndex}`).querySelector('span').innerText = `[${keyMap[dragTargetIndex].toUpperCase()}] ${timestamps[dragTargetIndex].toFixed(2)}s`;
                drawWave(dragTargetIndex, -delta);
            });

            window.addEventListener('pointerup', () => {
                if (pressTimer) clearTimeout(pressTimer);
                if (dragTargetIndex !== null) {
                    document.getElementById(`pad-${dragTargetIndex}`).classList.remove('tweaking');
                    player?.seekTo(timestamps[dragTargetIndex], true);
                    dragTargetIndex = null;
                }
                isDragging = false;
            });

            document.getElementById('clear-all-btn').addEventListener('click', () => {
                if(confirm("全クリアしますか？")){
                    timestamps.fill(null);
                    document.querySelectorAll('.pad').forEach((p, i) => {
                        p.className = 'pad empty';
                        p.querySelector('span').innerText = `[${keyMap[i].toUpperCase()}] EMPTY`;
                    });
                }
            });

            document.getElementById('pip-btn').addEventListener('click', async () => {
                const video = document.querySelector('video');
                if (video) await video.requestPictureInPicture().catch(console.error);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                let i = btn.getAttribute('data-index');
                timestamps[i] = null;
                const p = document.getElementById(`pad-${i}`);
                p.className = 'pad empty';
                p.querySelector('span').innerText = `[${keyMap[i].toUpperCase()}] EMPTY`;
            }));
        });

                function initPlayer(videoId) {
            if (player) player.destroy();
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: { 
                    'playsinline': 1,
                    'controls': 0,      /* コントローラーを非表示 */
                    'disablekb': 1,     /* キーボード操作を無効化 */
                    'fs': 0,            /* フルスクリーンボタン非表示 */
                    'modestbranding': 1 /* YouTubeロゴを最小限に */
                },
                events: { 'onReady': () => setInterval(() => {
                    if (!isDragging) document.getElementById('current-time').innerText = player.getCurrentTime().toFixed(2);
                }, 100) }
            });
        }


        function playPad(index) {
            playAttackSound();
            const el = document.getElementById(`pad-${index}`);
            el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 40);
            try { player.seekTo(timestamps[index], true); player.playVideo(); } catch (e) {}
        }

        function playAttackSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(80, now + soundDuration);
            gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + soundDuration);
            osc.start(now); osc.stop(now + soundDuration);
        }

        function generateMockWaveData() { mockWaveData = Array.from({length: 300}, () => Math.random()); }
        function drawWave(index, offset) {
            const canvas = document.getElementById(`canvas-${index}`);
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            mockWaveData.forEach((d, i) => ctx.fillRect(i * 3, canvas.height / 2 - d * 20, 2, d * 40));
        }

        let tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.body.appendChild(tag);
    </script>
</body>
</html>
